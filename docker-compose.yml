version: '3.8'

services:
    api:
        container_name: hnstudio-api
        image: hnstudio-api:latest
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '8080:8080'
        # Dùng file .env để nạp các biến môi trường (như Supabase URL, Key)
        env_file:
            - .env
        restart: unless-stopped
